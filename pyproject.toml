[project]
name = "web-scraping"
version = "0.3.30"
description = "Web scraping tutorial"
authors = [
    { name = "Carlos Pinto", email = "carlospinto4p@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "jupyter>=1.0.0",
    "requests>=2.28.2",
    "beautifulsoup4>=4.12.0",
    "pandas>=1.5.3",
    "html5lib>=1.1",
    "lxml>=4.9.2",
    "tqdm>=4.65.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "pre-commit>=4.2.0",
]

[tool.ruff]
line-length = 78

[tool.ruff.lint]
# Pins ruff's default rule set explicitly (verified via
# `ruff check --show-settings` against 0.15.9) so a future ruff
# release can't silently turn on new default rules underneath us.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
